version: '3.8'

services:
  # REST API Service (FastAPI + Trained Model)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ott-audience-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MODEL_PATH=models/audience_pipeline.joblib
      - METADATA_PATH=models/metadata.json
      - PROFILES_PATH=models/cluster_profiles.json
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Evaluation Service (Runs independent ML & API evaluation)
  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ott-audience-evaluation
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - DATA_PATH=data/viewers.csv
      - MODEL_PATH=models/audience_pipeline.joblib
      - METADATA_PATH=models/metadata.json
      - PROFILES_PATH=models/cluster_profiles.json
      - OUTPUT_DIR=evaluation
    volumes:
      - ./evaluation:/app/evaluation
      - ./models:/app/models
      - ./data:/app/data
    command: python -m evaluation.generate_report --api-url http://api:8000 --data data/viewers.csv

  # Frontend Demo Dashboard
  frontend:
    image: nginx:alpine
    container_name: ott-audience-dashboard
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
